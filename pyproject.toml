[project]
name = "literature-mining-llm"
version = "0.1.0"
description = "Literature mining and citation analysis tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "lxml>=4.9.0",
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.1.1",
]

[project.optional-dependencies]
selenium = [
    "selenium>=4.15.0",
    "webdriver-manager>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
