[project]
name = "literatureminingllm"
version = "0.1.0"
description = "Agentic flow for extracting structured research data about MXenes from JSON metadata files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "ipykernel>=6.30.1",
    "langchain>=0.3.27",
    "langchain-openai>=0.3.32",
    "matplotlib>=3.10.6",
    "numpy>=2.3.3",
    "pandas>=2.3.2",
    "pydantic>=2.11.7",
    "scipy>=1.16.1",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
    "google-generativeai>=0.8.3",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.23",
]
